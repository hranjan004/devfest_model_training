[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ucsc-wildlife-vision"
version = "1.0.0"
description = "UCSC Wildlife Vision — 20-Species Identification, Confidence Calibration, and Photo Quality Rating with Colab, Vertex AI, and Gemini 4 Argon"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT (code only; dataset images governed by individual CC0/CC-BY licenses)"}
authors = [
    {name = "Harsh Ranjan", email = "hranjan@ucsc.edu"}
]
dependencies = [
    "numpy>=1.24.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "albumentations>=1.3.1",
    "timm>=0.9.12",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "torchmetrics>=1.2.0",
]
cloud = [
    "google-cloud-storage>=2.14.0",
    "google-cloud-aiplatform>=1.42.0",
    "google-genai>=0.3.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.7",
]
app = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "open_clip_torch>=2.26.1",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.23.0",
    "Pillow>=10.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.7",
    "requests>=2.31.0",
]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.26.0",
]

[project.scripts]
wildlife-train = "wildlife.train:main"
wildlife-evaluate = "wildlife.evaluate:main"
wildlife-infer = "wildlife.infer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
